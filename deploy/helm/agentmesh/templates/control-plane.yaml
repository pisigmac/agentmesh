apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentmesh.fullname" . }}-control-plane
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: agentmesh-control-plane
  template:
    metadata:
      labels:
        app: agentmesh-control-plane
    spec:
      containers:
        - name: control-plane
          image: {{ .Values.controlPlane.image }}
          ports:
            - name: http
              containerPort: {{ .Values.controlPlane.httpPort }}
            - name: grpc
              containerPort: {{ .Values.controlPlane.grpcPort }}
          env:
            - name: ENV
              value: {{ .Values.env | quote }}
            - name: AGGREGATE_DEFAULT_ORG
              value: {{ .Values.aggregateDefaultOrg | quote }}
            - name: ETCD_ENDPOINTS
              value: {{ join "," .Values.etcd.endpoints | quote }}
            - name: REDIS_ADDR
              value: {{ .Values.redis.addr | quote }}
            - name: CLICKHOUSE_ADDR
              value: {{ .Values.clickhouse.addr | quote }}
            - name: CLICKHOUSE_DATABASE
              value: {{ .Values.clickhouse.database | quote }}
            - name: SCORE_PROVIDER
              value: {{ .Values.score.provider | quote }}
            - name: GUARDLOOP_ENABLED
              value: {{ .Values.guardloop.enabled | quote }}
            {{- if .Values.guardloop.baseUrl }}
            - name: GUARDLOOP_BASE_URL
              value: {{ .Values.guardloop.baseUrl | quote }}
            {{- end }}
            - name: STRIPE_ENABLED
              value: {{ .Values.stripe.enabled | quote }}
            {{- if .Values.stripe.meterEventName }}
            - name: STRIPE_METER_EVENT_NAME
              value: {{ .Values.stripe.meterEventName | quote }}
            {{- end }}
            {{- if .Values.stripe.orgCustomers }}
            - name: STRIPE_ORG_CUSTOMERS
              value: {{ .Values.stripe.orgCustomers | quote }}
            {{- end }}
            {{- if .Values.stripe.secretKeyExistingSecret }}
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.stripe.secretKeyExistingSecret }}
                  key: secret_key
            {{- end }}
            {{- if .Values.stripe.webhookSecretExistingSecret }}
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.stripe.webhookSecretExistingSecret }}
                  key: webhook_secret
            {{- end }}
            - name: TRACELENS_ENABLED
              value: {{ .Values.tracelens.enabled | quote }}
            - name: TRACELENS_OTLP_ENDPOINT
              value: {{ .Values.tracelens.otlpEndpoint | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          resources:
            {{- toYaml .Values.controlPlane.resources | nindent 12 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "agentmesh.fullname" . }}-control-plane
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      app: agentmesh-control-plane
---
{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "agentmesh.fullname" . }}-control-plane
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "agentmesh.fullname" . }}-control-plane
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
