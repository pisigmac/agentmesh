syntax = "proto3";

package agentmesh.v1;

option go_package = "github.com/agentmesh/agentmesh/gen/agentmesh/v1;agentmeshv1";

service AgentMesh {
  rpc RegisterAgent(AgentRegistration) returns (RegistrationAck);
  rpc DiscoverAgents(DiscoveryQuery) returns (stream AgentEndpoint);
  rpc RouteRequest(RoutePayload) returns (RouteResponse);
  rpc ReportHealth(HealthStatus) returns (HealthAck);
  rpc ReportRouteOutcome(RouteOutcome) returns (RouteOutcomeAck);
  rpc GetCircuitState(CircuitQuery) returns (CircuitState);
}

message AgentRegistration {
  string org_id = 1;
  string agent_id = 2;
  string agent_type = 3;
  repeated string capabilities = 4;
  string endpoint_url = 5;
  HealthStatus health = 6;
  CostProfile cost_profile = 7;
  map<string, string> metadata = 8;
}

message CostProfile {
  double cost_per_request_usd = 1;
  double cost_per_1k_tokens_usd = 2;
}

message RegistrationAck {
  string agent_id = 1;
  int64 lease_ttl_seconds = 2;
  string message = 3;
}

message DiscoveryQuery {
  string org_id = 1;
  string capability = 2;
  double max_cost = 3;
  string routing_strategy = 4;
  int32 limit = 5;
  bool include_unhealthy = 6;
}

message AgentEndpoint {
  string agent_id = 1;
  string agent_type = 2;
  string endpoint_url = 3;
  repeated string capabilities = 4;
  double estimated_latency_ms = 5;
  double success_rate = 6;
  double cost_score = 7;
  double rank_score = 8;
  string org_id = 9;
  bool healthy = 10;
  bool persistent = 11;
}

message RoutePayload {
  string org_id = 1;
  string source_agent_id = 2;
  string capability = 3;
  string routing_strategy = 4;
  repeated string fallback_agent_types = 5;
  bytes payload_hint = 6;
  map<string, string> headers = 7;
  // Hard pin: route to this agent when set (see force_pin / pin_failover).
  string destination_agent_id = 8;
  // Soft preference: move these eligible agents to the front of the ranked list.
  repeated string prefer_agent_ids = 9;
  // When true, allow pin even if unhealthy or missing capability.
  bool force_pin = 10;
  // When true and the pinned agent's circuit is open, fall back to normal ranking.
  bool pin_failover = 11;
}

message RouteResponse {
  string destination_agent_id = 1;
  string destination_agent_type = 2;
  string endpoint_url = 3;
  map<string, string> injected_headers = 4;
  repeated AgentEndpoint fallback_chain = 5;
  int32 timeout_ms = 6;
  int32 max_retries = 7;
  string trace_context = 8;
}

message HealthStatus {
  string agent_id = 1;
  bool healthy = 2;
  string message = 3;
  int64 reported_at_unix = 4;
}

message HealthAck {
  bool accepted = 1;
}

// RouteOutcome is reported by the data plane after a proxy attempt (E7 LatencyEWMA writers).
message RouteOutcome {
  string org_id = 1;
  string agent_id = 2;
  double latency_ms = 3;
  bool success = 4;
}

message RouteOutcomeAck {
  bool accepted = 1;
  double latency_ewma_ms = 2;
}

message CircuitQuery {
  string org_id = 1;
  string destination_agent_id = 2;
}

message CircuitState {
  string state = 1;
  int32 failure_count = 2;
  int64 opened_at_unix = 3;
  int64 half_open_at_unix = 4;
  int32 threshold = 5;
  int32 window_seconds = 6;
}
